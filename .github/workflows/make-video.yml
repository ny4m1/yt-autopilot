name: Make video

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC (09:17 Tbilisi)
  workflow_dispatch:
    inputs:
      count:
        description: "How many videos to make"
        default: "1"

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Generate video(s)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main.py --count "${{ github.event.inputs.count || '1' }}"

      - name: Upload videos (download from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: output/
          retention-days: 14

      - name: Remember topics so they are not repeated
        run: |
          git config user.name "yt-autopilot"
          git config user.email "yt-autopilot@users.noreply.github.com"
          git add history.json || true
          git diff --cached --quiet || (git commit -m "Update topic history" && git push)
