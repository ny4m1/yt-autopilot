name: Make video

on:
  schedule:
    # 5 runs a day (UTC). Tbilisi time = UTC+4: 06:23, 09:41, 13:13, 16:47, 20:29
    - cron: "23 2 * * *"
    - cron: "41 5 * * *"
    - cron: "13 9 * * *"
    - cron: "47 12 * * *"
    - cron: "29 16 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many videos to make"
        default: "1"

permissions:
  contents: write

concurrency:
  group: make-video
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Generate video(s)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python main.py --upload --count "${{ github.event.inputs.count || '1' }}"

      - name: Upload videos (download from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: output/
          retention-days: 14

      - name: Publish each video as a GitHub Release (your Mac downloads from here)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in output/*/; do
            name=$(basename "$dir")
            [ -f "$dir/video.mp4" ] || continue
            title=$(sed -n '2p' "$dir/upload.txt")
            mkdir -p "/tmp/rel/$name"
            cp "$dir/video.mp4" "/tmp/rel/$name/$name.mp4"
            cp "$dir/upload.txt" "/tmp/rel/$name/$name.txt"
            [ -f "$dir/thumbnail.jpg" ] && cp "$dir/thumbnail.jpg" "/tmp/rel/$name/$name.jpg"
            gh release create "v-$name" /tmp/rel/$name/* \
              --title "$title" --notes-file "$dir/upload.txt" --target "$GITHUB_SHA"
          done

      - name: Remember topics so they are not repeated
        run: |
          git config user.name "yt-autopilot"
          git config user.email "yt-autopilot@users.noreply.github.com"
          git add history.json || true
          git diff --cached --quiet || (git commit -m "Update topic history" && git pull --rebase origin main && git push)
